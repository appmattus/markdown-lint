name: Android CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - name: Build with Gradle
      run: ./gradlew assemble check --project-cache-dir=../cache --stacktrace
