name: Android CI

on:
  push:
    branches:
    - main
    tags:
    - '**'
  pull_request:
    branches:
    - main

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - name: Build with Gradle
      run: ./gradlew assemble check --project-cache-dir=../cache --stacktrace

  # Releases publish only once the build has passed on every platform
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    # Signing and Maven Central credentials, set up as in appmattus/crypto
    - name: Prepare tag properties
      env:
        GPG_SIGNING_SECRET_KEY_RING_FILE_BASE64: ${{ secrets.GPG_SIGNING_SECRET_KEY_RING_FILE_BASE64 }}
        GPG_GRADLE_PROPERTIES: ${{ secrets.GPG_GRADLE_PROPERTIES }}
      run: |
        mkdir -p "$HOME/.gradle"
        echo "$GPG_SIGNING_SECRET_KEY_RING_FILE_BASE64" | base64 -d > "$HOME/.gradle/sonatype-appmattus-keys.gpg"
        echo "$GPG_GRADLE_PROPERTIES" > "$HOME/.gradle/gradle.properties"

    # The plugin depends on core, so core goes to Maven Central first
    - name: Upload core to Maven Central
      run: ./gradlew :core:publishAllPublicationsToMavenCentral -P"signing.secretKeyRingFile=$HOME/.gradle/sonatype-appmattus-keys.gpg"

    # Maven Central can take a while to make a release downloadable; publishing the plugin before then would leave
    # users with a plugin whose dependency can't be resolved
    - name: Wait for core on Maven Central
      run: |
        url="https://repo1.maven.org/maven2/com/appmattus/markdownlint/core/${GITHUB_REF_NAME}/core-${GITHUB_REF_NAME}.pom"
        for attempt in $(seq 1 60); do
          if curl --silent --fail --head "$url" > /dev/null; then
            echo "core ${GITHUB_REF_NAME} is available on Maven Central"
            exit 0
          fi
          echo "Waiting for core ${GITHUB_REF_NAME} on Maven Central (attempt $attempt of 60)"
          sleep 60
        done
        echo "core ${GITHUB_REF_NAME} was not available on Maven Central after 60 minutes"
        exit 1

    - name: Upload plugin to the Gradle Plugin Portal
      env:
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      run: ./gradlew :markdown:publishPlugins -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
